; โปรเจกต์เดียว 2 environment:  sniffer (802.11)  และ  netwatch (ARP/DNS)
; Build/Upload:  pio run -e sniffer -t upload   |   pio run -e netwatch -t upload

[platformio]
default_envs = sniffer

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; ถ้า upload ยังหลุดให้ลดเหลือ: upload_speed = 115200
; upload_port = /dev/ttyUSB0

[env:sniffer]
build_src_filter = -<*> +<sniffer/>
build_flags = -Isrc/sniffer

[env:netwatch]
build_src_filter = -<*> +<netwatch/>
build_flags = -Isrc/netwatch
